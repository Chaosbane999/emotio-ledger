<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmotioHours</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⏱</text></svg>">
</head>
<body>

<header class="top">
  <div class="brand">Emotio<span>Hours</span></div>
  <nav class="tabs" id="tabs">
    <button data-view="agency" class="on">Agency</button>
    <button data-view="time">Time</button>
    <button data-view="people">People</button>
    <button data-view="contracts">Contracts</button>
    <button data-view="internal">Internal</button>
    <button data-view="schedule">Schedule</button>
    <button data-view="reports">Reports</button>
    <button data-view="settings">Settings</button>
  </nav>
  <div class="spacer"></div>
  <span class="muted" id="whoami"></span>
  <button class="btn small" id="signOut">Sign out</button>
  <label class="muted" for="period">Month</label>
  <select id="period"></select>
  <button class="btn small" id="addMonth" title="Add the next month, copying this month's plan forward">+ Month</button>
  <button class="btn small danger" id="delMonth" title="Delete this month and everything planned in it">Delete month</button>
</header>

<main>
  <section class="view" id="view"><p class="muted">Loading…</p></section>
</main>

<script src="app.js"></script>
</body>
</html>
