<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EmotioHours — sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand" style="font-size:1.3rem">Emotio<span>Hours</span></div>
    <p class="muted" id="mode">Sign in with your email and password.</p>
    <form id="loginForm">
      <div id="personal">
        <input type="email" id="email" placeholder="Email" autofocus autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      </div>
      <div id="shared" class="hidden">
        <input type="password" id="passcode" placeholder="Shared passcode" autocomplete="current-password">
      </div>
      <p class="err hidden" id="loginErr" style="margin-top:10px">That didn't match — try again.</p>
      <button type="submit" class="btn primary" style="margin-top:12px;width:100%">Sign in</button>
    </form>
    <p class="muted" style="margin-top:14px;text-align:center">
      <a href="#" id="toggle">Use the shared passcode instead</a></p>
  </div>
</div>
<script>
let sharedMode = false;
const $ = (id) => document.getElementById(id);

$('toggle').addEventListener('click', (e) => {
  e.preventDefault();
  sharedMode = !sharedMode;
  $('personal').classList.toggle('hidden', sharedMode);
  $('shared').classList.toggle('hidden', !sharedMode);
  $('mode').textContent = sharedMode
    ? 'Enter the shared passcode. This signs you in as an admin.'
    : 'Sign in with your email and password.';
  $('toggle').textContent = sharedMode
    ? 'Use your own email and password instead'
    : 'Use the shared passcode instead';
  $('loginErr').classList.add('hidden');
  (sharedMode ? $('passcode') : $('email')).focus();
});

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = sharedMode
    ? { passcode: $('passcode').value }
    : { email: $('email').value, password: $('password').value };
  const r = await fetch('/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (r.ok) location.href = '/';
  else $('loginErr').classList.remove('hidden');
});
</script>
</body>
</html>
